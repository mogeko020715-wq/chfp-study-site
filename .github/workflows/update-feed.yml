name: Update market feed

on:
  schedule:
    # 周一至周五 17:20 CST（收盘后）更新日报
    - cron: '20 9 * * 1-5'
    # 周日 17:20 CST 汇总周报
    - cron: '20 9 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe data sources
        run: python scripts/update_feed.py --probe
      - name: Update daily feed
        run: python scripts/update_feed.py
      - name: Update weekly digest (Sundays)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '20 9 * * 0'
        run: python scripts/update_feed.py --weekly
      - name: Commit feed.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/feed.json
          if git diff --cached --quiet; then
            echo "无数据变化，无需提交"
          else
            git commit -m "data: 行情日报/周报自动更新 $(date -u +%Y-%m-%d)"
            git push
          fi
